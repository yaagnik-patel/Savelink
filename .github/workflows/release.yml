name: Build & Publish SaveLink Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: savelink

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = "v$ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

          $exists = git tag -l $tag
          if ($exists -and "${{ github.event_name }}" -eq "push" -and -not "${{ github.ref }}".StartsWith("refs/tags/")) {
            echo "should_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag already exists. Skipping release."
          } else {
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Host "Preparing release for $tag"
          }

      - name: Setup Node.js
        if: steps.pkg.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: savelink/package-lock.json

      - name: Install dependencies
        if: steps.pkg.outputs.should_release == 'true'
        run: npm ci

      - name: Build application
        if: steps.pkg.outputs.should_release == 'true'
        run: npm run build

      - name: Package & Publish to GitHub Releases
        if: steps.pkg.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
